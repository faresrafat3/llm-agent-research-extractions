name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: Lint and parse check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: pip install --upgrade pip && pip install ruff
      - name: Ruff (syntax + undefined names)
        # This is a 20-paper extraction index. The CI gate just confirms
        # the extracted code at least parses; running the explorer
        # requires streamlit, loguru, pandas.
        # algorithm1_pseudocode.py is excluded — it's literally
        # pseudocode from the STORM paper and references functions
        # (gen_related_topics, gen_ans, ...) that are intentionally
        # undefined there.
        run: |
          ruff check build_sdk.py explorer/ projects/ --select=E9,F63,F7,F82 \
            --exclude 'projects/**/algorithm1_pseudocode.py'
      - name: Python compile check
        run: |
          python3 -m compileall -q build_sdk.py explorer/ projects/
